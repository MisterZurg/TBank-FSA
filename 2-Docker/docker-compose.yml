services:
  tbank-db:
    container_name: tbank-db
    image: postgres:16.2-alpine
    environment:
      POSTGRES_USER: "AlexanderZorkin" # Get it?
      POSTGRES_PASSWORD: "somnoynadno"
      POSTGRES_DB: "tbank_fsa" # This optional env can be used to define a different name for the default database that is created when the image is first started. If it is not specified, then the value of POSTGRES_USER will be used.
      POSTGRES_HOST: "tbank-db" # service-name
      POSTGRES_PORT: "5432"
    restart: always
    networks:
      - tbank-dev
    ports:
      - "5432:5432"
    volumes:
      - "./build/postgre_init.sql:/docker-entrypoint-initdb.d/postgre_init.sql"

networks:
  tbank-dev:
    driver: bridge
